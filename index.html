<html lang="fr">

<body>

    <h1>Puissance 4</h1>
<div class="difficulty-selector">
  <input type="radio" id="easy" name="difficulty" value="easy" checked>
  <label for="easy" class="easy">Facile</label>

  <input type="radio" id="medium" name="difficulty" value="medium">
  <label for="medium" class="medium">Moyen</label>

  <input type="radio" id="hard" name="difficulty" value="hard">
  <label for="hard" class="hard">Difficile</label>

  <input type="radio" id="expert" name="difficulty" value="expert">
  <label for="expert" class="expert">Expert</label>
</div>
    <div id="board"></div>
    <div id="status"></div>
    <button id="restart">Rejouer</button>

    <script type="module" src="dist/main.js"></script>
</body>
